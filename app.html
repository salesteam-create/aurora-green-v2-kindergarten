<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aurora Green Genesis — Compliance Platform Demo</title>
  <link rel="icon" type="image/png" href="aurora_green_logo__21__480.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen">
  <!-- Demo Mode bar -->
  <div id="demo-bar" class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800 text-sm">
    <div class="max-w-[1600px] mx-auto px-6 py-2.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="pill pill-info">DEMO MODE</span>
        <span class="text-slate-400">Viewing as:</span>
        <span id="persona-label" class="text-slate-100 font-medium">—</span>
      </div>
      <div class="flex items-center gap-2">
        <label class="text-slate-400">Switch persona:</label>
        <select id="persona-select" class="bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-slate-100 focus:outline-none focus:border-teal-400">
          <!-- owner and scientific personas are hidden in this demo; internal keys remain wired. -->
          <option value="dnv">Overview — Authority</option>
          <option value="compliance">Compliance — Entity</option>
        </select>
        <button id="reset-demo" class="ml-2 px-3 py-1.5 rounded-md border border-slate-700 text-slate-300 hover:border-teal-400 hover:text-teal-300">Reset Demo</button>
      </div>
    </div>
  </div>

  <!-- App shell -->
  <div class="max-w-[1600px] mx-auto px-6 py-6 flex gap-6">
    <!-- Sidebar -->
    <aside class="agg-sidebar w-60 shrink-0 relative rounded-xl px-3 py-4">
      <a href="index.html" class="flex items-center gap-2 mb-8 px-2 hover:opacity-80 transition-opacity" title="Back to landing page">
        <img src="aurora_green_logo__21__480.png" alt="AGG" class="h-8 w-auto" />
      </a>
      <nav id="sidebar-nav" class="space-y-1 relative z-10"></nav>
      <div class="mt-10 px-2 text-xs text-slate-500 relative z-10">
        <div id="sidebar-footer"></div>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 min-w-0">
      <div id="view-root"></div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/content.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components/score-ring.js"></script>
  <script src="js/components/charts.js"></script>
  <script src="js/components/digital-twin.js"></script>
  <script src="js/components/upload.js"></script>
  <script src="js/personas/owner.js"></script>
  <script src="js/personas/compliance.js"></script>
  <script src="js/personas/dnv.js"></script>
  <script src="js/personas/scientific.js"></script>
  <script src="js/views/vault-door.js"></script>
  <script src="js/views/all-assets.js"></script>
  <script src="js/views/suppliers.js"></script>
  <script src="js/router.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
